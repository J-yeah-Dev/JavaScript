<title>Pairs</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
<script type="text/javascript" src="app.js" defer></script>

<main>
  <header>
    <h1><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>Pairs</h1>
    <div class="sizes" role="group" aria-label="Board size">
      <button type="button" id="size-s" data-size="s" aria-pressed="false">3 × 4</button>
      <button type="button" id="size-m" data-size="m" aria-pressed="true">4 × 4</button>
      <button type="button" id="size-l" data-size="l" aria-pressed="false">4 × 6</button>
    </div>
  </header>

  <div class="stats" aria-live="off">
    <div class="stat"><span>Moves</span><b id="moves">0</b></div>
    <div class="stat"><span>Time</span><b id="time">0:00</b></div>
    <div class="stat"><span>Best</span><b id="best">–</b></div>
  </div>

  <div class="board" id="board" data-cols="4"></div>

  <div class="result" id="result" role="status">
    <p id="msg">Flip two cards. Match every pair in as few moves as you can.</p>
  </div>
</main>
