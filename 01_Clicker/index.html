<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Clicker Game</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>

    <h1>Score: <span id="score">0</span> | High Score: <span id="highScore">0</span></h1>
    <p>Time Remaining: <span id="timer">30</span> seconds</p>
    <!-- <div id="target" class="ball"></div> -->
    <div id="target"  class="sphere-container">
     <div  class="sphere"></div>
    </div>

    <!-- The custom Game Over popup modal -->
    <div id="popup" class="modal-overlay">
        <div class="modal-box">
            <h2>Game Over!</h2>
            <p id="finalScoreText">You clicked the circle 0 times.</p>
            <button id="retryBtn">Retry</button>
        </div>
    </div>

</body>
</html>
