<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
<main class="app">
  <h1>Tic Tac Toe</h1>

  <div class="mode" role="group" aria-label="Game mode">
    <button id="mode-cpu" class="active">vs Computer</button>
    <button id="mode-2p">2 Players</button>
  </div>

  <div class="scores">
    <div class="score x" id="score-x"><span id="label-x">You (X)</span><b class="x-color" id="n-x">0</b></div>
    <div class="score" id="score-d"><span>Draws</span><b id="n-d">0</b></div>
    <div class="score o" id="score-o"><span id="label-o">CPU (O)</span><b class="o-color" id="n-o">0</b></div>
  </div>

  <div class="status" id="status" aria-live="polite"></div>
  <div class="board" id="board"></div>

  <div class="actions">
    <button class="primary" id="new-game">New game</button>
    <button id="reset-scores">Reset scores</button>
  </div>
</main>
</body>
</html>
