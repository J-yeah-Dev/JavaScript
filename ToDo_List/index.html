<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
    <script type="text/javascript" src="app.js" defer></script>
</head>
<body>
    <div class="container">

        <header class="header">
            <h1>To-Do List</h1>
            <p>Drag tasks to reorder them.</p>
        </header>

        <!-- Add Task Form -->
        <section class="form-section">
            <h2>Add Task</h2>

            <form id="todo-form">
                <div class="form-group">
                    <label for="todo-input">Task</label>
                    <input
                        type="text"
                        id="todo-input"
                        name="task"
                        placeholder="e.g. Finish JS project"
                        autocomplete="off"
                        required
                    >
                </div>

                <button type="submit" class="add-btn">Add</button>
            </form>
        </section>

        <!-- Task List -->
        <section class="list-section">

            <div class="list-header">
                <h2>My Tasks</h2>
                <span id="task-count">0 tasks left</span>
            </div>

            <div class="filter-bar">
                <button type="button" class="filter-btn active" data-filter="all">All</button>
                <button type="button" class="filter-btn" data-filter="active">Active</button>
                <button type="button" class="filter-btn" data-filter="completed">Completed</button>
            </div>

            <ul id="todo-list" class="todo-list">
                <!-- JS will create items like this: -->
                <!-- <li class="todo-item" draggable="true" data-id="...">
                    <input type="checkbox" class="todo-check">
                    <span class="todo-text">Task text</span>
                    <button class="delete-btn">Delete</button>
                </li> -->
               
            </ul>

            <p class="empty-message" id="empty-message">
                No tasks yet. Add one above!
            </p>

        </section>

    </div>
</body>
</html>
